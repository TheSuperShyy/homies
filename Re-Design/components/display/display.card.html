<!-- @dsCard group="Components" viewport="700x400" subtitle="Card, StatCard, DataTable" name="Display" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../demo-loader.js"></script>
<style>body{margin:0;background:var(--bg-0);font-family:var(--font-ui)}</style>
</head><body><div id="root"><div style="height:100vh;background:var(--bg-0)"></div></div>
<script type="text/babel-demo">
(async () => {
const { Card, StatCard, DataTable, Button, Delta, Badge } = await window.loadDS("../../components/", window.DS_ALL);
function Demo(){
  const cols = [
    { key: "stock", label: "Stock" },
    { key: "price", label: "Last Price" },
    { key: "change", label: "Change %", render: r => <Delta value={r.change} /> },
    { key: "cap", label: "Market Cap", align: "right" },
  ];
  const rows = [
    { stock: "TSLA", price: "$ 26,000.21", change: "+3.4%", cap: "$ 564.06 B" },
    { stock: "AAPL", price: "$ 32,000.21", change: "-3.4%", cap: "$ 564.06 B" },
  ];
  return (
    <div style={{padding:20, display:"grid", gridTemplateColumns:"240px 1fr", gap:16}}>
      <div style={{display:"flex", flexDirection:"column", gap:12}}>
        <StatCard hero label="Total Holding" value="$ 12,304.11" delta="+3.68 ($ 5.32)" />
        <StatCard label="AAPL" value="$ 1,721.3" delta="-1.3%" sub="Units 104" />
      </div>
      <Card title="Portfolio Overview" action={<Button variant="secondary" size="sm">See all</Button>}>
        <DataTable columns={cols} rows={rows} />
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
})();
</script></body></html>
