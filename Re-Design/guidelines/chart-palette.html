<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;display:flex;font-family:var(--font-ui)}
.half{flex:1;height:160px;padding:14px;box-sizing:border-box}</style></head><body>
<div class="half" style="background:var(--bg-0)">
<svg width="100%" height="100%" viewBox="0 0 320 130" preserveAspectRatio="none">
<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2D7FF9" stop-opacity="0.35"/><stop offset="1" stop-color="#2D7FF9" stop-opacity="0.02"/></linearGradient></defs>
<path d="M0 80 L40 60 L80 72 L120 40 L160 55 L200 30 L240 52 L280 38 L320 50 L320 130 L0 130 Z" fill="url(#g1)"/>
<path d="M0 80 L40 60 L80 72 L120 40 L160 55 L200 30 L240 52 L280 38 L320 50" fill="none" stroke="#2D7FF9" stroke-width="2"/>
<line x1="200" y1="30" x2="200" y2="130" stroke="#2D7FF9" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="200" cy="30" r="4" fill="#2D7FF9" stroke="#fff" stroke-width="1.5"/>
</svg></div>
<div class="half" data-theme="light" style="background:var(--bg-0)">
<svg width="100%" height="100%" viewBox="0 0 320 130" preserveAspectRatio="none">
<defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22251F" stop-opacity="0.22"/><stop offset="1" stop-color="#22251F" stop-opacity="0.02"/></linearGradient></defs>
<path d="M0 80 L40 60 L80 72 L120 40 L160 55 L200 30 L240 52 L280 38 L320 50 L320 130 L0 130 Z" fill="url(#g2)"/>
<path d="M0 80 L40 60 L80 72 L120 40 L160 55 L200 30 L240 52 L280 38 L320 50" fill="none" stroke="#22251F" stroke-width="2"/>
<circle cx="200" cy="30" r="4" fill="#22251F" stroke="#fff" stroke-width="1.5"/>
</svg></div>
</body></html>
