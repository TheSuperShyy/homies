<!-- @dsCard group="Colors" viewport="700x150" subtitle="Dark theme canvas + surfaces" name="Dark surfaces" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:var(--bg-0);display:flex;gap:12px;padding:16px;box-sizing:border-box}
.sw{flex:1;border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:118px;box-sizing:border-box}
.n{font-size:11px;color:var(--text-2)}.v{font-size:11px;color:var(--text-3)}</style></head><body>
<div class="sw" style="background:var(--bg-0);border:1px solid var(--border-1)"><span class="n">--bg-0</span><span class="v">#060709</span></div>
<div class="sw" style="background:var(--bg-sidebar);border:1px solid var(--border-1)"><span class="n">--bg-sidebar</span><span class="v">#0A0B0E</span></div>
<div class="sw" style="background:var(--surface-1);border:1px solid var(--border-1)"><span class="n">--surface-1</span><span class="v">#101114</span></div>
<div class="sw" style="background:var(--surface-2);border:1px solid var(--border-1)"><span class="n">--surface-2</span><span class="v">#16181D</span></div>
<div class="sw" style="background:var(--surface-3);border:1px solid var(--border-2)"><span class="n">--surface-3</span><span class="v">#1D2026</span></div>
</body></html>
