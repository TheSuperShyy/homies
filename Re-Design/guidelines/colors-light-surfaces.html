<!-- @dsCard group="Colors" viewport="700x150" subtitle="Light theme canvas + surfaces (Skillset palette)" name="Light surfaces" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);display:flex;gap:12px;padding:16px;box-sizing:border-box}
.sw{flex:1;border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:118px;box-sizing:border-box}
.n{font-size:11px;color:var(--text-2)}.v{font-size:11px;color:var(--text-3)}</style></head>
<body data-theme="light" style="background:var(--bg-0)">
<div class="sw" style="background:var(--bg-0);border:1px solid var(--border-2)"><span class="n">--bg-0</span><span class="v">#E5E4E1</span></div>
<div class="sw" style="background:var(--surface-1);border:1px solid var(--border-1)"><span class="n">--surface-1</span><span class="v">#FFFFFF</span></div>
<div class="sw" style="background:var(--surface-2);border:1px solid var(--border-1)"><span class="n">--surface-2</span><span class="v">#F3F3F1</span></div>
<div class="sw" style="background:var(--surface-3);border:1px solid var(--border-2)"><span class="n">--surface-3</span><span class="v">#EAEAE7</span></div>
<div class="sw" style="background:var(--accent)"><span class="n" style="color:#B9BBB4">--accent</span><span class="v" style="color:#8B8D86">#22251F</span></div>
</body></html>
