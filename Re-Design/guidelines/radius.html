<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Pill-heavy radius system" name="Corner radii" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:var(--bg-0);padding:16px 24px;height:150px;box-sizing:border-box;display:flex;gap:14px;align-items:center}
.r{background:var(--surface-2);border:1px solid var(--border-1);width:110px;height:80px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-2)}</style></head><body>
<div class="r" style="border-radius:var(--radius-sm)">sm · 10</div>
<div class="r" style="border-radius:var(--radius-md)">md · 14</div>
<div class="r" style="border-radius:var(--radius-lg)">lg · 20</div>
<div class="r" style="border-radius:var(--radius-xl)">xl · 26</div>
<div class="r" style="border-radius:var(--radius-pill);height:40px">pill</div>
</body></html>
