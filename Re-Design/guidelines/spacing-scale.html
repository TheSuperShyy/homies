<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:var(--bg-0);padding:20px 24px;height:140px;box-sizing:border-box;display:flex;gap:18px;align-items:flex-end}
.bar{background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;width:36px}
.l{font-size:10px;color:var(--text-2);text-align:center;margin-top:6px}</style></head><body>
<div><div class="bar" style="height:4px"></div><div class="l">1·4</div></div>
<div><div class="bar" style="height:8px"></div><div class="l">2·8</div></div>
<div><div class="bar" style="height:12px"></div><div class="l">3·12</div></div>
<div><div class="bar" style="height:16px"></div><div class="l">4·16</div></div>
<div><div class="bar" style="height:20px"></div><div class="l">5·20</div></div>
<div><div class="bar" style="height:24px"></div><div class="l">6·24</div></div>
<div><div class="bar" style="height:32px"></div><div class="l">8·32</div></div>
<div><div class="bar" style="height:40px"></div><div class="l">10·40</div></div>
<div style="font-size:11px;color:var(--text-3);margin-left:8px;align-self:center">card padding 20–24 · grid gap 16–24</div>
</body></html>
